async function exportData() {
  try {
    const data = await api('GET', '/api/export');
    const filename = `lesson-engine-${todayStr()}.json`;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { showToast('Export failed.', 'error'); }
}

async function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    await api('POST', '/api/import', data);
    await loadData();
    refreshTeacherOptions();
    refreshStudentOptions();
    renderSettings();
    showToast('Import successful!', 'success');
  } catch(e) {
    showToast('Import failed. Make sure the file is a valid Lesson Engine backup.', 'error');
  }
  e.target.value = '';
}

async function clearAllData() {
  if (!confirm('Are you sure you want to clear all data? This cannot be undone.')) return;
  if (!confirm('Final confirmation: permanently delete all classes, books, units, lessons, students, and logs?')) return;
  try {
    await api('DELETE', '/api/clear');
    DB = { classes: [], units: [], subunits: [], lessons: [], logs: [], students: [], enrollments: [], studentnotes: [], attendances: [] };
    refreshTeacherOptions();
    refreshStudentOptions();
    renderSettings();
  } catch(e) { showToast('Failed to clear data.', 'error'); }
}

async function saveStudent() {
  const classId = document.getElementById('student-classId').value;
  const name    = document.getElementById('student-name').value.trim();
  const level   = document.getElementById('student-level').value || 'Pre-CEFR';
  if (!name) { showToast('Please enter a student name.', 'error'); return; }
  const normalizedName = name.toLocaleLowerCase();
  let student = DB.students.find(entry => (entry.name || '').trim().toLocaleLowerCase() === normalizedName) || null;
  const createdNew = !student;

  if (!student) {
    const assessment = {
      phonics: { start: level, current: level },
      general: { start: 'Pre-A1', current: 'Pre-A1' },
      reading: { start: 'Pre-A1', current: 'Pre-A1' },
      listening: { start: 'Pre-A1', current: 'Pre-A1' },
      speakingNotes: ''
    };
    student = { id: 'st_' + Date.now(), name, level, assessment, reportCard: normalizeReportCard({ id: 'temp', name, level, assessment }) };
    try {
      await api('POST', '/api/students', student);
      DB.students.push(student);
      refreshStudentOptions([student.name]);
    } catch (e) {
      showToast('Failed to save student.', 'error');
      return;
    }
  } else if (student.level !== level) {
    const assessment = normalizeStudentAssessment(student);
    assessment.phonics.current = level;
    student = buildAssessmentPayload({ ...student, name }, assessment);
    try {
      await api('POST', '/api/students', student);
      DB.students = DB.students.map(entry => entry.id === student.id ? student : entry);
    } catch (e) {
      showToast('Failed to update student level.', 'error');
      return;
    }
  }

  if (enrollmentForStudentInClass(student.id, classId)) {
    showToast('That student is already in this class.', 'info');
    return;
  }

  const enrollment = { id: `en_${student.id}_${classId}`, studentId: student.id, classId };
  setBusy('save-student-btn', true);
  try {
    await api('POST', '/api/enrollments', enrollment);
    DB.enrollments.push(enrollment);
    closeModal('modal-student');
    renderStudents();
    showToast(createdNew ? 'Student created and added to class.' : 'Student added to class.', 'success');
  } catch(e) { showToast('Failed to enroll student.', 'error'); }
  finally { setBusy('save-student-btn', false); }
}

async function deleteStudent(studentId, classId) {
  const st = getStudent(studentId);
  const enrollment = enrollmentForStudentInClass(studentId, classId);
  if (!st || !enrollment) return;
  if (!confirm(`Remove student "${st.name}" from this class?`)) return;
  try {
    await api('DELETE', `/api/enrollments/${enrollment.id}`);
    DB.enrollments = DB.enrollments.filter(entry => entry.id !== enrollment.id);
    renderStudents();
    showToast('Student removed from class.', 'success');
  } catch(e) { showToast('Failed to remove student from class.', 'error'); }
}

async function persistStudentRecord(updated) {
  await api('POST', '/api/students', updated);
  DB.students = DB.students.map(entry => entry.id === updated.id ? updated : entry);
}

async function saveStudentProfilePage() {
  const student = normalizeStudentRecord(getStudent(currentStudentProfile.studentId));
  if (!student) return;
  const assessment = normalizeStudentAssessment(student);
  document.querySelectorAll('.profile-skill-start').forEach(select => {
    assessment[select.dataset.skill].start = select.value;
  });
  document.querySelectorAll('.profile-skill-current').forEach(select => {
    assessment[select.dataset.skill].current = select.value;
  });
  const updated = buildAssessmentPayload({ ...student, diagnostics: student.diagnostics, speakingLog: student.speakingLog }, assessment);
  setBusy('save-profile-btn', true);
  try {
    await persistStudentRecord(updated);
    renderStudents();
    renderStudentProfilePage();
    showToast('Student profile updated.', 'success');
  } catch (e) {
    showToast('Failed to update student profile.', 'error');
  } finally {
    setBusy('save-profile-btn', false);
  }
}

async function addSpeakingNote(studentId) {
  const input = document.getElementById('profile-speaking-note-input');
  const note = input?.value.trim();
  const student = normalizeStudentRecord(getStudent(studentId));
  if (!student || !note) {
    showToast('Please enter a speaking note.', 'error');
    return;
  }
  const updated = {
    ...student,
    diagnostics: student.diagnostics,
    speakingLog: [
      ...(student.speakingLog || []),
      { id: `sp_${Date.now()}`, createdAt: new Date().toISOString(), note }
    ]
  };
  try {
    await persistStudentRecord(updated);
    renderStudents();
    renderStudentProfilePage();
    showToast('Speaking note added.', 'success');
  } catch (e) {
    showToast('Failed to save speaking note.', 'error');
  }
}

async function addDiagnosticRecord(studentId) {
  const student = normalizeStudentRecord(getStudent(studentId));
  if (!student) return;
  const date = document.getElementById('diagnostic-date')?.value || '';
  const title = document.getElementById('diagnostic-title')?.value.trim() || '';
  const comments = document.getElementById('diagnostic-comments')?.value.trim() || '';
  const fileInput = document.getElementById('diagnostic-file');
  const file = fileInput?.files?.[0];

  if (!date || !title) {
    showToast('Please add a diagnostic date and title.', 'error');
    return;
  }
  if (file && file.type !== 'application/pdf') {
    showToast('Diagnostic upload must be a PDF.', 'error');
    return;
  }

  let fileDataUrl = '';
  if (file) {
    fileDataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = reject;
      reader.readAsDataURL(file);
    }).catch(() => '');
    if (!fileDataUrl) {
      showToast('Could not read the PDF file.', 'error');
      return;
    }
  }

  const updated = {
    ...student,
    diagnostics: [
      ...(student.diagnostics || []),
      {
        id: `diag_${Date.now()}`,
        date,
        title,
        comments,
        fileName: file ? file.name : '',
        fileDataUrl
      }
    ],
    speakingLog: student.speakingLog || []
  };

  try {
    await persistStudentRecord(updated);
    renderStudents();
    renderStudentProfilePage();
    showToast('Diagnostic record added.', 'success');
  } catch (e) {
    showToast('Failed to save diagnostic record.', 'error');
  }
}

async function removeDiagnostic(studentId, diagnosticId) {
  const student = normalizeStudentRecord(getStudent(studentId));
  if (!student) return;
  const updated = {
    ...student,
    diagnostics: (student.diagnostics || []).filter(item => item.id !== diagnosticId),
    speakingLog: student.speakingLog || []
  };
  try {
    await persistStudentRecord(updated);
    renderStudents();
    renderStudentProfilePage();
    showToast('Diagnostic record removed.', 'success');
  } catch (e) {
    showToast('Failed to remove diagnostic record.', 'error');
  }
}

function printStudentReport() {
  const student = normalizeStudentRecord(getStudent(currentStudentReport.studentId));
  if (!student) return;
  const classId = currentStudentReport.classId || classesForStudent(student.id)[0]?.id || '';
  const focusClass = DB.classes.find(cls => cls.id === classId);
  const reportData = reportFormData(student);
  const existingFrame = document.getElementById('report-print-frame');
  if (existingFrame) existingFrame.remove();
  const frame = document.createElement('iframe');
  frame.id = 'report-print-frame';
  frame.style.position = 'fixed';
  frame.style.right = '0';
  frame.style.bottom = '0';
  frame.style.width = '0';
  frame.style.height = '0';
  frame.style.border = '0';
  frame.style.opacity = '0';
  document.body.appendChild(frame);

  const doc = frame.contentWindow?.document;
  if (!doc || !frame.contentWindow) {
    frame.remove();
    showToast('Print preview could not be created.', 'error');
    return;
  }

  const html = buildPrintableReportDocument(student, focusClass, reportData);
  doc.open();
  doc.write(html);
  doc.close();

  const cleanup = () => setTimeout(() => frame.remove(), 800);
  frame.onload = () => {
    setTimeout(() => {
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
      } catch (e) {
        showToast('Printing failed. Please try again.', 'error');
      } finally {
        cleanup();
      }
    }, 250);
  };

  if (doc.readyState === 'complete') {
    frame.onload();
  }
}

async function saveStudentReportPage() {
  const student = normalizeStudentRecord(getStudent(currentStudentReport.studentId));
  if (!student) return;
  const reportCard = { ...student.reportCard, ...reportFormData(student) };
  const updated = { ...student, reportCard, diagnostics: student.diagnostics, speakingLog: student.speakingLog };
  setBusy('save-report-btn', true);
  try {
    await persistStudentRecord(updated);
    renderStudents();
    renderStudentReportPage();
    showToast('Report card saved.', 'success');
  } catch (e) {
    showToast('Failed to save report card.', 'error');
  } finally {
    setBusy('save-report-btn', false);
  }
}

async function saveClass() {
  const existingId = document.getElementById('cls-id').value;
  const name    = document.getElementById('cls-name').value.trim();
  const teacher = document.getElementById('cls-teacher').value.trim();
  const start   = document.getElementById('cls-start').value;
  const tstart  = document.getElementById('cls-tstart').value;
  const tend    = document.getElementById('cls-tend').value;
  const days    = Array.from(document.querySelectorAll('#cls-days .day-toggle.active')).map(b => b.dataset.day);

  if (!name)  { showToast('Please enter a class name.', 'error'); return; }
  if (!teacher) { showToast('Please enter a teacher name.', 'error'); return; }
  if (!start) { showToast('Please enter a start date.', 'error'); return; }

  const cls = { id: existingId || ('c_' + Date.now()), name, teacher, start, tstart, tend, days };
  setBusy('save-class-btn', true);
  try {
    await api('POST', '/api/classes', cls);
    if (existingId) { DB.classes = DB.classes.map(c => c.id === existingId ? cls : c); }
    else { DB.classes.push(cls); }
    refreshTeacherOptions([teacher]);
    closeModal('modal-class');

// ════════════════════════════════════════════════════
// DELETE
// ════════════════════════════════════════════════════
async function deleteClass(classId) {
  const cls = DB.classes.find(c => c.id === classId);
  if (!cls) return;
  if (!confirm(`Delete class "${cls.name}" and all its books, units, lessons, and logs?`)) return;
  try {
    await api('DELETE', `/api/classes/${classId}`);
    const bookIds    = DB.units.filter(u => u.classId === classId).map(u => u.id);
    const subIds     = DB.subunits.filter(s => s.classId === classId).map(s => s.id);
    const lessonIds  = DB.lessons.filter(l => l.classId === classId).map(l => l.id);
    DB.logs          = DB.logs.filter(g => !lessonIds.includes(g.lessonId));
    DB.studentnotes  = DB.studentnotes.filter(n => !lessonIds.includes(n.lessonId));
    DB.attendances   = DB.attendances.filter(entry => !lessonIds.includes(entry.lessonId));
    DB.lessons       = DB.lessons.filter(l => l.classId !== classId);
    DB.subunits      = DB.subunits.filter(s => s.classId !== classId);
    DB.units         = DB.units.filter(u => u.classId !== classId);
    DB.enrollments   = DB.enrollments.filter(enrollment => enrollment.classId !== classId);
    DB.classes       = DB.classes.filter(c => c.id !== classId);
    bookIds.forEach(id => delete expandedBooks[id]);
    subIds.forEach(id  => delete expandedSubunits[id]);
    delete expandedClasses[classId];
    renderClasses();
  } catch(e) { showToast('Failed to delete class.', 'error'); }
}

async function deleteBook(bookId) {
  const book = DB.units.find(u => u.id === bookId);
  if (!book) return;
  if (!confirm(`Delete book "${book.name}" and all its units and lessons?`)) return;
  try {
    await api('DELETE', `/api/units/${bookId}`);
    const subIds    = DB.subunits.filter(s => s.bookId === bookId).map(s => s.id);
    const lessonIds = DB.lessons.filter(l => l.bookId === bookId).map(l => l.id);
    DB.logs     = DB.logs.filter(g => !lessonIds.includes(g.lessonId));
    DB.attendances = DB.attendances.filter(entry => !lessonIds.includes(entry.lessonId));
    DB.lessons  = DB.lessons.filter(l => l.bookId !== bookId);
    DB.subunits = DB.subunits.filter(s => s.bookId !== bookId);
    DB.units    = DB.units.filter(u => u.id !== bookId);
    subIds.forEach(id => delete expandedSubunits[id]);
    delete expandedBooks[bookId];
    renderClasses();
  } catch(e) { showToast('Failed to delete book.', 'error'); }
}

async function deleteSubunit(subunitId) {
  const su = DB.subunits.find(s => s.id === subunitId);
  if (!su) return;
  if (!confirm(`Delete unit "${subunitDisplayName(su)}" and all its lessons?`)) return;
  try {
    await api('DELETE', `/api/subunits/${subunitId}`);

    DB.logs     = DB.logs.filter(g => !lessonIds.includes(g.lessonId));

async function deleteLesson(lessonId) {
  const lesson = DB.lessons.find(l => l.id === lessonId);
  if (!lesson) return;
  if (!confirm(`Delete lesson "${lessonDisplayName(lesson)}"?`)) return;
  try {
    await api('DELETE', `/api/lessons/${lessonId}`);
    DB.logs         = DB.logs.filter(g => g.lessonId !== lessonId);
    DB.studentnotes = DB.studentnotes.filter(n => n.lessonId !== lessonId);
    DB.attendances  = DB.attendances.filter(entry => entry.lessonId !== lessonId);

// ════════════════════════════════════════════════════
// UTILITY
// ════════════════════════════════════════════════════
function setBusy(btnId, busy, originalText) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = busy;
  if (busy) { btn._origText = btn.textContent; btn.textContent = 'Saving…'; }
  else { btn.textContent = btn._origText || (originalText || 'Save'); }
}

// INIT
// ════════════════════════════════════════════════════
async function init() {
  document.getElementById('tab-today').innerHTML = `<div class="loading-state">Loading…</div>`;
  updateHeroSummary();

    await loadData();
    refreshTeacherOptions();
    refreshStudentOptions();
    renderToday();
  } catch(e) {
    document.getElementById('tab-today').innerHTML =
      `<div class="error-state">Could not connect to server.<br>Make sure the server is running.</div>`;

}

init();
